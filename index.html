<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify - Web Player: Music for everyone</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/utility.css">
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
</head>

<body>
    <div class="container flex bg-black">
        <div class="left ">
            <div class="close">
                <img width="30px" src="img/close.svg">
            </div>
            <div class="home bg-grey rounded m-1 p-1">

                <div class="logo invert"><img height="120px" src="img/logo1.svg" alt="logo"></div>
                <ul>
                    <li><img src="img/home.svg" alt="home" class="invert" height="25px">Home</li>
                    <li><img src="img/search.svg" alt="search" class="invert" height="25px">Search</li>
                </ul>

            </div>
            <div class="library bg-grey rounded m-1 p-1">

                <div class="heading">
                    <h2>Your Library</h2>
                </div>
                <div class="songList">
                    <ul>

                    </ul>
                </div>
                <div class="footer">
                    <div>
                        <a href="https://www.spotify.com/in-en/legal/">
                            Legal
                        </a>
                    </div>

                    <div>
                        <a href="https://www.spotify.com/in-en/safetyandprivacy/">
                            Safety &amp; Privacy Center
                        </a>
                    </div>

                    <div>
                        <a href="https://www.spotify.com/in-en/legal/privacy-policy/">
                            Privacy Policy
                        </a>
                    </div>

                    <div>
                        <a href="https://www.spotify.com/in-en/legal/cookies-policy/">
                            Cookies
                        </a>
                    </div>

                    <div>
                        <a href="https://www.spotify.com/in-en/legal/privacy-policy/#s3">
                            About Ads
                        </a>
                    </div>

                    <div>
                        <a href="https://www.spotify.com/in-en/accessibility/">
                            Accessibility
                        </a>
                    </div>
                </div>

            </div>

        </div>

        <div class="right bg-grey rounded ">
            <div class="header">
                <div class="nav">
                    <div class="hamburgerContainer">
                        <img src="img/hamburger.svg" class="hamburger" width="40px">

                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="30" height="30"
                            color="#ffffff" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"
                            stroke-linejoin="round">
                            <path d="M15 6C15 6 9.00001 10.4189 9 12C8.99999 13.5812 15 18 15 18"></path>
                        </svg>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="30" height="30"
                            color="#ffffff" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"
                            stroke-linejoin="round">
                            <path d="M9.00005 6C9.00005 6 15 10.4189 15 12C15 13.5812 9 18 9 18"></path>
                        </svg>
                    </div>

                </div>

                <div class="buttons">
                    <button class="signUp-btn">Sign up</button>
                    <button class="login-btn">Log in</button>
                </div>
            </div>

            <div class="spotify-playlists">
                <h1>Spotify Playlists</h1>
                <div class="cardContainer">

                </div>

                <div class="playbar">
                    <div class="seekbar">
                        <div class="circle">

                        </div>
                    </div>

                    <div class="aboveBar">
                        <div class="song-info"></div>

                        <div class="song-btns">
                            <img width="35px" id="previous" src="img/prev-song.svg">
                            <img width="35px" id="play" src="img/play.svg">
                            <img width="35px" id="next" src="img/next-song.svg">
                        </div>

                        <div class="timevol">
                            <div class="song-time"></div>

                            <div class="volume">
                                <img width="25px" src="img/volume.svg">
                                <div class="range">
                                    <input type="range" name="volume">
                                </div>
                            </div>
                        </div>

                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="JavaScript/script.js"></script>
</body>

</html>
